[package]
edition      = "2024"
name         = "atnode-s3"
rust-version = "1.88"
version      = "0.1.0"

[features]
# Compile-time feature matrix (mirror of esp32/arduino/features.h):
#   core: kbd-usb / kbd-ble (R6) / led-color / hws (GPIO·ADC·I2C)
#   comm: mqtt / http / rathole        (WiFi is the base, always on)
# Disabled features report "<x> disabled" on every channel and drop out
# of the ability JSON; led-color additionally removes the RMT driver and
# frees GPIO48.
#
# Variants (build.sh maps names to these sets):
#   full    = everything except kbd-ble (R6)
#   remoter = full - rathole
#   base    = full - rathole - http - ssdp (production kbd, serial-only config)
#   rathole = led-color + http + rathole + ssdp (tunnel test unit)
#   ble     = kbd-ble + led-color only (R6 bring-up: WiFi OFF to free the
#             ~46 KB internal-heap blob for the BLE controller)
default   = ["wifi", "led-color", "rathole", "mqtt", "http", "hws", "kbd-usb", "ssdp"]
# WiFi is the base of every networked variant; kbd-ble-only builds drop it
# because the WiFi blob's internal-heap appetite starves the BLE controller.
wifi      = ["esp-radio/wifi"]
led-color = []
rathole   = ["wifi"]
mqtt      = ["wifi"]
http      = ["wifi"]
hws       = []
kbd-usb   = ["dep:usb-device", "dep:usbd-hid", "esp-hal/__usb_otg"]
kbd-ble   = ["esp-radio/ble", "dep:trouble-host"]
# SSDP/UPnP discovery (Windows "Network" shows the device, "View device
# webpage" opens the SPA). Requires http (serves /description.xml);
# runs only while the HTTP service is enabled at runtime.
ssdp      = ["http", "embassy-net/udp", "embassy-net/multicast"]

[dependencies]
esp-hal = { version = "~1.1.0", features = ["esp32s3", "log-04", "unstable"] }

esp-rtos = { version = "0.3.0", features = [
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32s3",
  "log-04",
] }

esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32s3", "log-04"] }
log                    = "0.4.27"

embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-time     = { version = "0.5.0", features = ["log"] }
embassy-futures  = "0.1.2"
embassy-sync     = "0.7.2"  # pinned to trouble-host 0.6's version: the gatt_server macro emits our crate's embassy_sync types into trouble's AttributeServer
esp-alloc        = "0.10.0"
allocator-api2   = { version = "0.3", default-features = false, features = ["alloc"] }
esp-backtrace = { version = "0.19.0", features = [
  "esp32s3",
  "panic-handler",
  "println",
] }
esp-println = { version = "0.17.0", features = ["esp32s3", "log-04"] }

esp-storage = { version = "0.9.0", features = ["esp32s3", "bytewise-read"] }
sequential-storage      = "8.0.1"
embedded-storage        = "0.3.1"
embedded-storage-async  = "0.4.1"
heapless                = "0.9.3"
sha2 = { version = "0.10", default-features = false }
usb-device = { version = "0.3", optional = true }
usbd-hid   = { version = "0.8", optional = true }

esp-radio = { version = "0.18.0", features = ["esp32s3", "unstable", "esp-alloc", "log-04"] }
embassy-net = { version = "0.9.1", features = ["dhcpv4", "medium-ethernet", "dns", "tcp"] }
embedded-tls = { version = "0.19.0", default-features = false, features = ["log", "rsa"] }
picoserve = { version = "0.19.0", default-features = false, features = ["embassy", "alloc"] }
embedded-io-async = "0.6.1"
embedded-io-async-07 = { package = "embedded-io-async", version = "0.7" }
embedded-io = "0.6.1"
embedded-io-07 = { package = "embedded-io", version = "0.7.1" }
rand_core = "0.6.4"
trouble-host = { version = "0.6", optional = true, default-features = false, features = ["gatt", "peripheral", "security", "derive", "default-packet-pool", "log"] }

critical-section = "1.2.0"
static_cell      = "2.1.1"

# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'
