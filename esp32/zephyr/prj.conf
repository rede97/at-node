# SPDX-License-Identifier: Apache-2.0
# AT-Node Zephyr variant (ESP32-S3) — application config
# Board: muselab/nano_esp32s3 (ESP32-S3-WROOM-1-N8R8, 8MB flash + 8MB octal PSRAM)

# --- Memory -------------------------------------------------------------
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=90112
CONFIG_ESP_SPIRAM=y
CONFIG_SPIRAM_MODE_OCT=y

# --- Console / logging ---------------------------------------------------
CONFIG_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=2
CONFIG_PRINTK=y

# --- Board peripherals ----------------------------------------------------
CONFIG_GPIO=y
CONFIG_LED_STRIP=y
CONFIG_SPI=y
CONFIG_ADC=y
CONFIG_ADC_ASYNC=y
CONFIG_I2C=y

# --- Persistent config (settings on NVS flash partition) ------------------
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# --- Networking / WiFi -----------------------------------------------------
CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS=y
CONFIG_POSIX_API=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_DHCPV4=y
CONFIG_WIFI=y
CONFIG_WIFI_LOG_LEVEL_ERR=y
CONFIG_ENTROPY_GENERATOR=y
CONFIG_DNS_RESOLVER=y
CONFIG_NET_STATISTICS=n
CONFIG_NET_LOG=y
CONFIG_NET_SHELL=n

# --- TLS (mbedTLS, CA verification) ----------------------------------------
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
CONFIG_TLS_CREDENTIALS=y
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_SSL_PROTO_TLS1_2=y
CONFIG_MBEDTLS_MD_C=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_ALG_SHA_384=y
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_RSA_WITH_AES_128_CBC_SHA256=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=60000
# p256m (implied by BT_ECC) breaks ECDHE in TLS handshake on esp32s3
# (-0x7F80 HW_ACCEL_FAILED); use builtin mbedTLS ECC instead.
CONFIG_MBEDTLS_PSA_P256M_DRIVER_ENABLED=n
CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN=2048

# --- MQTT ------------------------------------------------------------------
CONFIG_MQTT_LIB=y
CONFIG_MQTT_LIB_TLS=y

# --- HTTP server ------------------------------------------------------------
CONFIG_HTTP_SERVER=y
CONFIG_HTTP_SERVER_MAX_CLIENTS=2
CONFIG_HTTP_SERVER_MAX_URL_LENGTH=256
CONFIG_HTTP_SERVER_MAX_CONTENT_TYPE_LENGTH=32
CONFIG_HTTP_SERVER_CLIENT_BUFFER_SIZE=1024
CONFIG_HTTP_SERVER_STACK_SIZE=4096
CONFIG_JSON_LIBRARY=y

# --- Bluetooth LE (HID keyboard peripheral) ---------------------------------
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_SMP=y
CONFIG_BT_SETTINGS=y
CONFIG_BT_BAS=y
CONFIG_BT_DIS=y
CONFIG_BT_DIS_SETTINGS=y
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME_MAX=32
CONFIG_BT_DEVICE_APPEARANCE=961
CONFIG_BT_MAX_CONN=2
CONFIG_BT_MAX_PAIRED=4
CONFIG_BT_FILTER_ACCEPT_LIST=y
CONFIG_BT_ID_MAX=1

# --- USB device (HID keyboard over DWC2 OTG) --------------------------------
# HID class auto-enabled via CONFIG_USBD_HID_SUPPORT + "zephyr,hid-device" DT
# node (app.overlay). DMA mode is experimental on esp32s3 (esp_cache_msync
# null errors observed); slave-FIFO path is the proven one.
CONFIG_UDC_DWC2_DMA=n
CONFIG_USB_DEVICE_STACK_NEXT=y

CONFIG_CBPRINTF_FP_SUPPORT=n
CONFIG_REBOOT=y
